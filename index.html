<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SHSAT Math Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 900px;
      background: #030712;
      border-radius: 20px;
      padding: 20px 18px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0;
    }
    .chip {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      color: #9ca3af;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 16px;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }
    label {
      font-size: 0.8rem;
      color: #9ca3af;
      display: block;
      margin-bottom: 4px;
    }
    select, input[type="number"] {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: #020617;
      color: #f9fafb;
      font-size: 0.9rem;
      min-width: 120px;
    }
    button {
      cursor: pointer;
      border-radius: 999px;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #22c55e);
      color: #0b1120;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.5);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      box-shadow: none;
      cursor: not-allowed;
    }
    .status {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-left: auto;
    }
    .question-card {
      background: #020617;
      border-radius: 14px;
      padding: 12px 12px 14px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      margin-bottom: 10px;
    }
    .question-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 6px;
    }
    .question-text {
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .choices {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }
    .choice {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: #020617;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .choice input {
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .check-btn {
      margin-top: 10px;
    }
    .feedback {
      font-size: 0.85rem;
      margin-top: 6px;
    }
    .feedback.correct { color: #4ade80; }
    .feedback.incorrect { color: #f97373; }

    /* Login screen */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
      text-align: center;
    }
    #login-screen h2 { font-size: 1.2rem; margin: 0; }
    #login-screen p { color: #64748b; font-size: 0.85rem; margin: 0; }
    #login-screen input {
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: #0f172a;
      color: #f9fafb;
      font-size: 1rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      width: 180px;
    }
    #login-error { color: #f87171; font-size: 0.8rem; min-height: 1em; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Login screen -->
    <div id="login-screen" style="display:none">
      <h2>Welcome to SHSAT Practice</h2>
      <p>Enter your access code to get started</p>
      <input id="uid-input" type="text" placeholder="e.g. ALEX2025" maxlength="20" />
      <button class="btn-primary" id="login-btn">Enter</button>
      <div id="login-error"></div>
    </div>

    <!-- Main app (hidden until logged in) -->
    <div id="main-app" style="display:none">
    <div class="header">
      <h1>SHSAT Practice</h1>
      <div style="display:flex;gap:10px;align-items:center">
        <span id="user-greeting" style="font-size:0.8rem;color:#94a3b8"></span>
        <a href="/progress.html" style="font-size:0.8rem;font-weight:600;color:#0b1120;background:linear-gradient(135deg,#38bdf8,#22c55e);padding:6px 14px;border-radius:999px;text-decoration:none;box-shadow:0 4px 12px rgba(56,189,248,0.35)">📊 Track Progress</a>
        <button onclick="logout()" style="font-size:0.75rem;background:none;border:1px solid rgba(148,163,184,0.3);color:#64748b;padding:4px 10px;border-radius:999px;cursor:pointer">Switch user</button>
      </div>
    </div>
    <p class="subtitle">
      Choose a topic and difficulty, generate a small set of questions, and practice. Answers are checked locally.
    </p>

    <div class="controls">
  <div>
    <label for="subjectSelect">Subject</label>
    <select id="subjectSelect">
      <option value="math" selected>Math</option>
      <option value="ela">ELA</option>
    </select>
  </div>

  <div>
    <label for="topicSelect">Topic / Type</label>
    <select id="topicSelect">
      <!-- For math (default) -->
      <option value="mixed">Mixed</option>
      <option value="percent">Percent</option>
      <option value="ratios">Ratios & proportions</option>
      <option value="algebra">Algebra</option>
      <option value="geometry">Geometry (no diagrams)</option>
    </select>
  </div>

  <div>
    <label for="difficultySelect">Difficulty</label>
    <select id="difficultySelect">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>

  <div>
    <label for="countInput"># of questions</label>
    <input id="countInput" type="number" min="1" max="10" value="5" />
  </div>

  <button class="btn-primary" id="generateBtn">Generate</button>
  <div class="status" id="statusText">Idle</div>
</div>


    <div id="questionsContainer"></div>
  </div>

  <script>
    const generateBtn = document.getElementById("generateBtn");
    const statusText = document.getElementById("statusText");
    const subjectSelect = document.getElementById("subjectSelect");
    const topicSelect = document.getElementById("topicSelect");
    const difficultySelect = document.getElementById("difficultySelect");
    const countInput = document.getElementById("countInput");
    const questionsContainer = document.getElementById("questionsContainer");
// Swap topic options based on subject (Math vs ELA)
subjectSelect.addEventListener("change", () => {
  const subject = subjectSelect.value;
  topicSelect.innerHTML = "";

  if (subject === "math") {
    [
      ["mixed", "Mixed"],
      ["percent", "Percent"],
      ["ratios", "Ratios & proportions"],
      ["algebra", "Algebra"],
      ["geometry", "Geometry (no diagrams)"],
    ].forEach(([value, label]) => {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = label;
      topicSelect.appendChild(opt);
    });
  } else {
    // ELA topics/types
    [
      ["reading", "Reading comprehension (passages)"],
      ["editing", "Revising & editing sentences"],
      ["mixed", "Mixed ELA"],
    ].forEach(([value, label]) => {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = label;
      topicSelect.appendChild(opt);
    });
  }
});

    let currentQuestions = [];
    let currentSessionId = null;

    const HISTORY_KEY = "shsat_seen_prompts";
    const GENRE_KEY = "shsat_seen_genres";
    const HISTORY_MAX = 40;

    function loadSeenPrompts() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); }
      catch { return []; }
    }

    function saveSeenPrompts(prompts) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(prompts.slice(-HISTORY_MAX)));
    }

    function loadSeenGenres() {
      try { return JSON.parse(localStorage.getItem(GENRE_KEY) || "[]"); }
      catch { return []; }
    }

    function addToSeenPrompts(questions) {
      const seen = loadSeenPrompts();
      for (const q of questions) {
        const key = (q.prompt || "").slice(0, 120).trim();
        if (key && !seen.includes(key)) seen.push(key);
      }
      saveSeenPrompts(seen);
    }

    function addToSeenGenres(genre) {
      if (!genre) return;
      const seen = loadSeenGenres();
      seen.push(genre);
      localStorage.setItem(GENRE_KEY, JSON.stringify(seen.slice(-6)));
    }

    generateBtn.addEventListener("click", async () => {
  const subject = subjectSelect.value;
  const topic = topicSelect.value;
  const difficulty = difficultySelect.value;
  const count = Math.max(1, Math.min(10, parseInt(countInput.value || "5", 10)));
  const recentPrompts = loadSeenPrompts().slice(-20);
  const recentGenres = loadSeenGenres();

  generateBtn.disabled = true;
  statusText.textContent = "Generating questions...";
  questionsContainer.innerHTML = "";
  currentQuestions = [];

  try {
    const res = await fetch("/.netlify/functions/generate-questions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ subject, topic, difficulty, count, recentPrompts, recentGenres })
    });

        if (!res.ok) {
          throw new Error("Server error " + res.status);
        }

        const data = await res.json();
        currentQuestions = data.questions || [];
        addToSeenPrompts(currentQuestions);
        if (data.passageGenre) addToSeenGenres(data.passageGenre);

        // Create a session in Supabase for this batch
        currentSessionId = crypto.randomUUID();
        fetch("/.netlify/functions/save-result", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "create_session", sessionId: currentSessionId, subject, difficulty, userId: window.currentUserId || null }),
        }).catch(err => console.error("Failed to create session:", err));

        renderQuestions();
        statusText.textContent = `Loaded ${currentQuestions.length} question(s).`;
      } catch (err) {
        console.error(err);
        statusText.textContent = "Error generating questions.";
        questionsContainer.innerHTML = "<p>Something went wrong. Try again.</p>";
      } finally {
        generateBtn.disabled = false;
      }
    });

    function renderQuestions() {
      questionsContainer.innerHTML = "";
      let lastPassage = "";
      currentQuestions.forEach((q, idx) => {
        if (q.passage) lastPassage = q.passage;
        else if (q.topic === "reading") q = { ...q, passage: lastPassage };
        const card = document.createElement("div");
        card.className = "question-card";

        const header = document.createElement("div");
        header.className = "question-header";
        header.innerHTML = `<span>Question ${idx + 1}</span><span>${q.topic || ""} · ${q.difficulty || ""}</span>`;
        card.appendChild(header);

        // Optional passage (for ELA reading)
        if (q.passage) {
  const passage = document.createElement("div");
  passage.style.fontSize = "0.85rem";
  passage.style.whiteSpace = "pre-wrap";
  passage.style.marginBottom = "8px";
  passage.style.color = "#e5e7eb";
  passage.textContent = q.passage;
  card.appendChild(passage);
}

      const text = document.createElement("div");
      text.className = "question-text";
      text.textContent = q.prompt;
      card.appendChild(text);


        const list = document.createElement("ul");
        list.className = "choices";

        (q.choices || []).forEach((choiceText, cIdx) => {
          const li = document.createElement("li");
          li.className = "choice";

          const input = document.createElement("input");
          input.type = "radio";
          input.name = "q_" + idx;
          input.value = cIdx;

          const label = document.createElement("span");
          label.textContent = choiceText;

          li.appendChild(input);
          li.appendChild(label);
          list.appendChild(li);
        });

        card.appendChild(list);

        const checkBtn = document.createElement("button");
        checkBtn.className = "btn-primary check-btn";
        checkBtn.textContent = "Check answer";

        const feedback = document.createElement("div");
        feedback.className = "feedback";

        checkBtn.addEventListener("click", async () => {
  const selected = card.querySelector("input[type='radio']:checked");
  if (!selected) {
    feedback.textContent = "Pick an answer first.";
    feedback.className = "feedback";
    return;
  }

  const chosenIndex = parseInt(selected.value, 10);
  feedback.textContent = "Checking...";
  feedback.className = "feedback";

  try {
    const res = await fetch("/.netlify/functions/check-answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        subject: subjectSelect.value,
        question: {
          prompt: q.prompt,
          choices: q.choices,
          userIndex: chosenIndex,
          correctIndex: q.correctIndex,
          solution: q.solution
        }
      })
    });

    if (!res.ok) {
      throw new Error("Server error " + res.status);
    }

    const result = await res.json();
    const letters = ["A", "B", "C", "D"];
    const correctLetter = letters[result.correctIndex] || "?";

    if (result.isCorrect) {
      feedback.textContent = `Correct! 🎉`;
      feedback.className = "feedback correct";
    } else {
      feedback.textContent = `Not quite. Correct answer is ${correctLetter}.`;
      feedback.className = "feedback incorrect";
    }

    // Save answer to Supabase
    if (currentSessionId) {
      fetch("/.netlify/functions/save-result", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "save_answer",
          sessionId: currentSessionId,
          subject: subjectSelect.value,
          topic: q.topic || "mixed",
          difficulty: q.difficulty || difficultySelect.value,
          isCorrect: result.isCorrect,
        }),
      }).catch(err => console.error("Failed to save answer:", err));
    }

    // Optional: show solution explanation
    if (result.solution) {
      const expl = document.createElement("div");
      expl.style.marginTop = "4px";
      expl.style.fontSize = "0.8rem";
      expl.style.whiteSpace = "pre-wrap";
      expl.textContent = result.solution;
      card.appendChild(expl);
    }

  } catch (err) {
    console.error(err);
    feedback.textContent = "Error checking answer. Try again.";
    feedback.className = "feedback";
  }
});

        card.appendChild(checkBtn);
        card.appendChild(feedback);

        questionsContainer.appendChild(card);
      });
    }
  </script>
  </div> <!-- /main-app -->
  </div> <!-- /app -->

  <script>
    const LOGIN_KEY = "shsat_user";

    function getUser() {
      try { return JSON.parse(localStorage.getItem(LOGIN_KEY)); }
      catch { return null; }
    }

    function logout() {
      localStorage.removeItem(LOGIN_KEY);
      location.reload();
    }

    async function init() {
      const user = getUser();
      if (user) {
        showApp(user);
      } else {
        document.getElementById("login-screen").style.display = "flex";
      }
    }

    function showApp(user) {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("main-app").style.display = "block";
      document.getElementById("user-greeting").textContent = `Hi, ${user.name} 👋`;
      // Expose userId globally so session creation can use it
      window.currentUserId = user.uid;
    }

    document.getElementById("login-btn").addEventListener("click", async () => {
      const uid = document.getElementById("uid-input").value.trim().toUpperCase();
      const errEl = document.getElementById("login-error");
      errEl.textContent = "";
      if (!uid) return;

      document.getElementById("login-btn").disabled = true;
      document.getElementById("login-btn").textContent = "Checking...";

      try {
        const res = await fetch("/.netlify/functions/get-user", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uid }),
        });
        if (res.status === 404) { errEl.textContent = "Code not found. Try again."; return; }
        if (!res.ok) { errEl.textContent = "Something went wrong. Try again."; return; }
        const user = await res.json();
        localStorage.setItem(LOGIN_KEY, JSON.stringify(user));
        showApp(user);
      } catch {
        errEl.textContent = "Connection error. Try again.";
      } finally {
        document.getElementById("login-btn").disabled = false;
        document.getElementById("login-btn").textContent = "Enter";
      }
    });

    document.getElementById("uid-input").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("login-btn").click();
    });

    init();
  </script>
</body>
</html>
