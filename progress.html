<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SHSAT Progress Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 900px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 8px;
    }
    h1 { font-size: 1.4rem; margin: 0; }
    h2 { font-size: 1rem; margin: 0 0 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; }
    a {
      font-size: 0.8rem;
      color: #6366f1;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    /* Summary cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .card {
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 14px;
      padding: 16px 18px;
    }
    .card-label { font-size: 0.75rem; color: #64748b; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
    .card-value { font-size: 1.8rem; font-weight: 700; }
    .card-value.green { color: #4ade80; }
    .card-value.yellow { color: #facc15; }
    .card-value.red { color: #f87171; }

    /* Section wrapper */
    .section {
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    /* Topic table */
    .topic-row {
      display: grid;
      grid-template-columns: 140px 1fr 60px 60px;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .topic-name { font-size: 0.85rem; color: #e2e8f0; text-transform: capitalize; }
    .bar-track {
      background: #1e293b;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.6s ease;
    }
    .topic-pct { font-size: 0.8rem; color: #94a3b8; text-align: right; }
    .topic-count { font-size: 0.75rem; color: #475569; text-align: right; }

    /* Subject pills */
    .subject-pills { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill {
      background: #1e293b;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.85rem;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .pill-label { color: #94a3b8; text-transform: capitalize; }
    .pill-val { font-weight: 700; }

    /* Chart */
    .chart-wrap { position: relative; height: 220px; }

    /* Loading / error */
    .status { color: #64748b; font-size: 0.9rem; padding: 40px 0; text-align: center; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>Progress Tracker</h1>
      <div id="user-label" style="font-size:0.8rem;color:#64748b;margin-top:4px"></div>
    </div>
    <div style="display:flex;gap:12px;align-items:center">
      <a href="/" style="font-size:0.8rem;color:#6366f1;text-decoration:none">← Back to Practice</a>
      <button onclick="logout()" style="font-size:0.75rem;cursor:pointer;background:none;border:1px solid rgba(148,163,184,0.3);color:#64748b;padding:4px 10px;border-radius:999px">Switch user</button>
    </div>
  </div>

  <div id="root"><p class="status">Loading...</p></div>
</div>

<script>
  const LOGIN_KEY = "shsat_user";
  function getUser() {
    try { return JSON.parse(localStorage.getItem(LOGIN_KEY)); }
    catch { return null; }
  }
  function logout() {
    localStorage.removeItem(LOGIN_KEY);
    window.location.href = "/";
  }

async function load() {
  const root = document.getElementById("root");

  const user = getUser();
  if (!user) { window.location.href = "/"; return; }
  document.getElementById("user-label").textContent = user.name;

  let data;
  try {
    const res = await fetch(`/.netlify/functions/get-stats?userId=${encodeURIComponent(user.uid)}`);
    if (!res.ok) throw new Error("Server error " + res.status);
    data = await res.json();
  } catch (err) {
    root.innerHTML = `<p class="status">Failed to load stats: ${err.message}</p>`;
    return;
  }

  const { total, correct, byTopic, bySubject, overTime } = data;
  const overallAcc = total > 0 ? Math.round((correct / total) * 100) : 0;

  function accColor(pct) {
    if (pct >= 75) return "green";
    if (pct >= 50) return "yellow";
    return "red";
  }

  function barColor(pct) {
    if (pct >= 75) return "#4ade80";
    if (pct >= 50) return "#facc15";
    return "#f87171";
  }

  // --- Summary cards ---
  const cardsHtml = `
    <div class="cards">
      <div class="card">
        <div class="card-label">Questions Attempted</div>
        <div class="card-value">${total}</div>
      </div>
      <div class="card">
        <div class="card-label">Correct</div>
        <div class="card-value green">${correct}</div>
      </div>
      <div class="card">
        <div class="card-label">Overall Accuracy</div>
        <div class="card-value ${accColor(overallAcc)}">${overallAcc}%</div>
      </div>
      <div class="card">
        <div class="card-label">Sessions</div>
        <div class="card-value">${overTime.length}</div>
      </div>
    </div>`;

  // --- By subject ---
  const subjectHtml = `
    <div class="section">
      <h2>By Subject</h2>
      <div class="subject-pills">
        ${bySubject.map(s => `
          <div class="pill">
            <span class="pill-label">${s.subject}</span>
            <span class="pill-val ${accColor(s.accuracy)}">${s.accuracy}%</span>
            <span class="topic-count">${s.correct}/${s.total}</span>
          </div>`).join("")}
      </div>
    </div>`;

  // --- By topic ---
  const topicHtml = `
    <div class="section">
      <h2>Accuracy by Topic</h2>
      ${byTopic.length === 0
        ? `<p class="status" style="padding:12px 0">No data yet</p>`
        : byTopic.map(t => `
          <div class="topic-row">
            <span class="topic-name">${t.topic}</span>
            <div class="bar-track">
              <div class="bar-fill" style="width:${t.accuracy}%; background:${barColor(t.accuracy)}"></div>
            </div>
            <span class="topic-pct">${t.accuracy}%</span>
            <span class="topic-count">${t.correct}/${t.total}</span>
          </div>`).join("")}
    </div>`;

  // --- Over time chart ---
  const chartHtml = `
    <div class="section">
      <h2>Accuracy Over Time</h2>
      <div class="chart-wrap"><canvas id="timeChart"></canvas></div>
    </div>`;

  root.innerHTML = cardsHtml + subjectHtml + topicHtml + chartHtml;

  // Render Chart.js line chart
  if (overTime.length > 0) {
    const ctx = document.getElementById("timeChart").getContext("2d");
    new Chart(ctx, {
      type: "line",
      data: {
        labels: overTime.map((s, i) => `Session ${i + 1} (${s.date})`),
        datasets: [{
          label: "Accuracy %",
          data: overTime.map(s => s.accuracy),
          borderColor: "#6366f1",
          backgroundColor: "rgba(99,102,241,0.15)",
          borderWidth: 2,
          pointBackgroundColor: overTime.map(s => barColor(s.accuracy)),
          pointRadius: 5,
          fill: true,
          tension: 0.3,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            min: 0, max: 100,
            ticks: { color: "#64748b", callback: v => v + "%" },
            grid: { color: "rgba(148,163,184,0.08)" },
          },
          x: {
            ticks: { color: "#64748b", maxRotation: 30 },
            grid: { color: "rgba(148,163,184,0.08)" },
          },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.parsed.y}% (${overTime[ctx.dataIndex].correct}/${overTime[ctx.dataIndex].total} correct)`,
            },
          },
        },
      },
    });
  }
}

load();
</script>
</body>
</html>
